name: Analyze Hi3559V200 VENC libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: VUTSHYK/hi_sdk
          ref: main
          path: sdk
          persist-credentials: false
      - name: Inspect ARM archives and ELF objects
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi file
          mkdir -p reports
          ROOT=sdk/Hi3559V200_MobileCam_SDK_V1.0.1.3/amp
          {
            echo 'Hi3559V200 SDK V1.0.1.3 — binary inventory'
            date -u
            for os in a7_linux a7_liteos; do
              echo "=== $os ==="
              find "$ROOT/$os/mpp" -type f \( -name '*.a' -o -name '*.so' -o -name '*.ko' \) | sort
            done
          } > reports/inventory.txt
          for os in a7_linux a7_liteos; do
            for lib in libmpi.a libhi3559v200_venc.a libhi3559v200_vedu.a libhi3559v200_h264e.a libhi3559v200_h265e.a libhi3559v200_vi.a libhi3559v200_vpss.a libhi3559v200_rc.a libhi3559v200_chnl.a; do
              path="$ROOT/$os/mpp/lib/$lib"
              [ -f "$path" ] || continue
              prefix="reports/${os}_${lib}"
              file "$path" > "${prefix}.file.txt"
              arm-linux-gnueabi-ar t "$path" > "${prefix}.members.txt"
              arm-linux-gnueabi-nm -A "$path" > "${prefix}.symbols.txt" 2>&1 || true
              arm-linux-gnueabi-nm -A --undefined-only "$path" > "${prefix}.undefined.txt" 2>&1 || true
              arm-linux-gnueabi-objdump -f "$path" > "${prefix}.architecture.txt" 2>&1 || true
            done
          done
          {
            echo '=== Relevant symbols across archives ==='
            grep -E 'HI_MPI_VENC_|venc_mod_init|vedu|h264e|h265e|osal_|LOS_' reports/*.symbols.txt | head -n 3000 || true
          } > reports/relevant-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hi3559v200-venc-binary-audit
          path: reports/
          retention-days: 14
