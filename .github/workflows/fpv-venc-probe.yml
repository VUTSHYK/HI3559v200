name: FPV VENC probe unit tests
on:
  push:
    branches: [feature/openipc-fpv]
    paths:
      - 'fpv/apps/venc-probe/**'
      - '.github/workflows/fpv-venc-probe.yml'
  pull_request:
    paths:
      - 'fpv/apps/venc-probe/**'
      - '.github/workflows/fpv-venc-probe.yml'
jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run callback tests (mock SDK types)
        run: make -C fpv/apps/venc-probe/tests test
